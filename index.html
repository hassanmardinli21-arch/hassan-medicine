<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>إدارة الأدوية السحابية الشاملة - حسان مارديني</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: #f0f4f8;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        h2 {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 10px;
        }
        .summary-box {
            background: #e8f0fe;
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            text-align: center;
            flex-wrap: wrap;
            gap: 10px;
            border: 1px solid #b9d0f0;
        }
        .summary-item {
            font-size: 1rem;
            color: #1e3a8a;
        }
        .summary-item span {
            font-weight: 700;
            font-size: 1.2rem;
            display: block;
            color: #0f172a;
        }
        .btn-view-stock {
            background: #1e3a8a;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-view-stock:hover {
            background: #2563eb;
        }
        .btn-export {
            background: #16a34a;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-export:hover {
            background: #15803d;
        }
        .section-title {
            font-size: 1.1rem;
            color: #475569;
            margin-top: 20px;
            margin-bottom: 10px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 5px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        input,
        textarea,
        select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            background: #fff;
        }
        input:focus,
        textarea:focus,
        select:focus {
            border-color: #3b82f6;
        }
        .file-upload-group {
            grid-column: span 2;
            background: #f8fafc;
            padding: 10px;
            border: 1px dashed #cbd5e1;
            border-radius: 8px;
        }
        .file-upload-group label {
            display: block;
            font-size: 0.85rem;
            color: #475569;
            margin-bottom: 4px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            grid-column: span 2;
        }
        button.add-btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 600;
            flex: 1;
        }
        button.add-btn:hover {
            background-color: #1d4ed8;
        }
        button.cancel-edit-btn {
            background-color: #64748b;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 600;
            display: none;
        }
        button.cancel-edit-btn:hover {
            background-color: #475569;
        }
        .med-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .med-item {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
        }
        .med-main-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
        }
        .med-details {
            flex: 1;
            min-width: 150px;
        }
        .med-name {
            font-weight: 700;
            color: #0f172a;
            font-size: 1.1rem;
        }
        .med-info {
            font-size: 0.85rem;
            color: #64748b;
            margin-top: 3px;
        }
        .counter-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #e2e8f0;
            padding: 4px 10px;
            border-radius: 8px;
            font-weight: bold;
        }
        .counter-btn {
            background: #fff;
            border: 1px solid #cbd5e1;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .med-images {
            display: flex;
            gap: 8px;
            margin-top: 5px;
            flex-wrap: wrap;
        }
        .med-images img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            background: #fff;
        }
        .actions {
            display: flex;
            gap: 6px;
        }
        button.edit-btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        button.delete-btn {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .stock-warning {
            color: #dc2626;
            font-weight: 700;
            background: #fee2e2;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-right: 8px;
            display: inline-block;
            border: 1px solid #fca5a5;
        }
        .reminder-badge {
            color: #2563eb;
            font-weight: 600;
            font-size: 0.8rem;
            background: #dbeafe;
            padding: 2px 10px;
            border-radius: 20px;
            border: 1px solid #93c5fd;
            display: inline-block;
            margin-right: 8px;
        }
        .days-left-badge {
            color: #0f172a;
            font-weight: 700;
            font-size: 0.85rem;
            background: #e2e8f0;
            padding: 2px 12px;
            border-radius: 20px;
            border: 1px solid #94a3b8;
            display: inline-block;
            margin-right: 8px;
        }
        .days-left-badge.low {
            background: #fee2e2;
            border-color: #fca5a5;
            color: #b91c1c;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-content {
            background: #fff;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow-y: auto;
            position: relative;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .modal-header h3 {
            margin: 0;
            color: #1e3a8a;
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #64748b;
            line-height: 1;
        }
        .modal-close:hover {
            color: #ef4444;
        }
        .stock-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }
        .stock-table th {
            text-align: right;
            padding: 8px 4px;
            border-bottom: 2px solid #e2e8f0;
            color: #475569;
        }
        .stock-table td {
            padding: 8px 4px;
            border-bottom: 1px solid #f1f5f9;
        }
        .stock-table .med-name-col {
            font-weight: 600;
        }
        .stock-table .stock-col {
            font-weight: 700;
            color: #0f172a;
        }
        .empty-stock-msg {
            text-align: center;
            color: #94a3b8;
            padding: 20px 0;
        }
        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .file-upload-group {
                grid-column: span 1;
            }
            .btn-group {
                grid-column: span 1;
                flex-wrap: wrap;
            }
            .summary-box {
                flex-direction: column;
                gap: 5px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>💊 إدارة الأدوية السحابية الشاملة</h2>

        <!-- ملخص المخزون -->
        <div class="summary-box" id="summaryBox">
            <div class="summary-item">
                عدد الأدوية
                <span id="totalCount">0</span>
            </div>
            <div class="summary-item">
                إجمالي المخزون (حبة)
                <span id="totalStock">0</span>
            </div>
            <div style="display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;">
                <button class="btn-view-stock" id="viewStockBtn">📦 عرض المخزون التفصيلي</button>
                <button class="btn-export" id="exportBtn">📤 تصدير البيانات (JSON)</button>
            </div>
        </div>

        <div class="section-title" id="formTitle">➕ إضافة دواء جديد:</div>
        <input type="hidden" id="editId" value="" />
        <div class="form-grid">
            <input type="text" id="medCategory" placeholder="التصنيف (مثل: فيتامين، أنسولين)" />
            <input type="text" id="medName" placeholder="اسم الدواء *" />
            <input type="text" id="medDose" placeholder="الجرعة (مثل: قرص واحد)" />
            <input type="text" id="medTime" placeholder="وقت الاستخدام (مثل: مع الإفطار أو 14:30)" />

            <select id="medReminderTime">
                <option value="">-- اختر وقت التذكير (اختياري) --</option>
            </select>

            <input type="text" id="medDoctor" placeholder="اسم الطبيب" />
            <input type="number" id="medStock" placeholder="كمية المخزون (عدد الحبات)" />
            <input type="number" id="medThreshold" placeholder="حد التنبيه (مثل: 5)" value="5" />
            <!-- جرعات الصباح والمساء: يتم حساب الاستهلاك اليومي تلقائياً -->
            <div class="dose-schedule" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;">
                <div>
                    <label for="medMorningDose" style="display:block;margin-bottom:5px;font-weight:700;">☀️ حبة/وحدة الصباح</label>
                    <input type="number" id="medMorningDose" placeholder="مثال: 1" value="1" min="0" step="1" inputmode="numeric" />
                </div>
                <div>
                    <label for="medEveningDose" style="display:block;margin-bottom:5px;font-weight:700;">🌙 حبة/وحدة المساء</label>
                    <input type="number" id="medEveningDose" placeholder="مثال: 1" value="0" min="0" step="1" inputmode="numeric" />
                </div>
            </div>
            <div style="margin-top:10px;">
                <label for="medDailyConsumption" style="display:block;margin-bottom:5px;font-weight:700;">🔢 عدد الحبات/الوحدات يومياً (يُحسب تلقائياً)</label>
                <input type="number" id="medDailyConsumption" value="1" min="1" step="1" readonly style="background:#f1f5f9;font-weight:700;" />
                <small style="display:block;margin-top:4px;color:#64748b;">مثال: حبة صباحاً + حبة مساءً = 2 يومياً</small>
            </div>

            <div class="file-upload-group">
                <label>صورة العلبة (من الحاسوب):</label>
                <input type="file" id="img1File" accept="image/*" />
            </div>
            <div class="file-upload-group">
                <label>صورة الحبة (من الحاسوب):</label>
                <input type="file" id="img2File" accept="image/*" />
            </div>
            <div class="file-upload-group">
                <label>صورة إضافية (من الحاسوب):</label>
                <input type="file" id="img3File" accept="image/*" />
            </div>

            <textarea id="medNotes" placeholder="ملاحظات أو تعليمات خاصة" style="grid-column: span 2; height: 60px;"></textarea>

            <div class="btn-group">
                <button class="add-btn" id="saveBtn">☁️ حفظ وإضافة الدواء للسحاب</button>
                <button class="cancel-edit-btn" id="cancelBtn" onclick="resetForm()">↩️ إلغاء التعديل</button>
            </div>
        </div>

        <div class="section-title">💊 قائمة الأدوية والمخزون المحفوظ سحابياً:</div>
        <ul id="medList" class="med-list">
            <p style="text-align: center; color: #64748b;">? جاري تحميل الأدوية...</p>
        </ul>
    </div>

    <!-- ===== MODAL ===== -->
    <div class="modal-overlay" id="stockModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>📦 تفاصيل المخزون المتبقي</h3>
                <button class="modal-close" id="closeModalBtn">&times;</button>
            </div>
            <div id="modalBody">
                <p style="color: #64748b;">⏳ جاري تحميل البيانات...</p>
            </div>
        </div>
    </div>

    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, deleteDoc, updateDoc, doc, onSnapshot, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBrXDy3FuN6YJlIYTWCD_TsfMvkmiWZiLo",
            authDomain: "hassanmedication.firebaseapp.com",
            projectId: "hassanmedication",
            storageBucket: "hassanmedication.firebasestorage.app",
            messagingSenderId: "1023452446639",
            appId: "1:1023452446639:web:dedf54f7ff5c4c93d9795a",
            measurementId: "G-H1GL9JD2KP"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const medListEl = document.getElementById('medList');
        const saveBtn = document.getElementById('saveBtn');
        const totalCountEl = document.getElementById('totalCount');
        const totalStockEl = document.getElementById('totalStock');
        const modalBody = document.getElementById('modalBody');
        const reminderSelect = document.getElementById('medReminderTime');

        // =============================================
        // 1. ملء القائمة المنسدلة بجميع أوقات 24 ساعة (خطوة 30 دقيقة)
        // =============================================
        function populateTimeDropdown() {
            reminderSelect.innerHTML = '<option value="">-- اختر وقت التذكير (اختياري) --</option>';
            for (let h = 0; h < 24; h++) {
                for (let m = 0; m < 60; m += 30) {
                    const hourStr = String(h).padStart(2, '0');
                    const minStr = String(m).padStart(2, '0');
                    const timeValue = `${hourStr}:${minStr}`;
                    const option = document.createElement('option');
                    option.value = timeValue;
                    option.textContent = timeValue;
                    reminderSelect.appendChild(option);
                }
            }
        }
        populateTimeDropdown();

        // --- دوال مساعدة ---
        function convertFileToBase64(file) {
            return new Promise((resolve, reject) => {
                if (!file) { resolve(''); return; }
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        // --- دوال عامة (متاحة في onclick) ---
        window.resetForm = function() {
            document.getElementById('editId').value = '';
            document.getElementById('medCategory').value = '';
            document.getElementById('medName').value = '';
            document.getElementById('medDose').value = '';
            document.getElementById('medTime').value = '';
            document.getElementById('medReminderTime').value = '';
            document.getElementById('medDoctor').value = '';
            document.getElementById('medStock').value = '';
            document.getElementById('medThreshold').value = '5';
            document.getElementById('medMorningDose').value = '1';
            document.getElementById('medEveningDose').value = '0';
            document.getElementById('medDailyConsumption').value = '1';
            document.getElementById('img1File').value = '';
            document.getElementById('img2File').value = '';
            document.getElementById('img3File').value = '';
            document.getElementById('medNotes').value = '';
            document.getElementById('formTitle').innerText = '➕ إضافة دواء جديد:';
            saveBtn.innerText = '☁️ حفظ وإضافة الدواء للسحاب';
            document.getElementById('cancelBtn').style.display = 'none';
        };

        window.updateStock = async function(id, currentStock, change) {
            const stock = Math.max(0, Number(currentStock) || 0);
            const amount = Number(change) || 0;
            const newStock = Math.max(0, stock + amount);
            try {
                await updateDoc(doc(db, "medications", id), {
                    stock: newStock,
                    updatedAt: new Date()
                });
            } catch (e) {
                console.error("خطأ بتحديث المخزون:", e);
                alert("❌ تعذر تحديث المخزون. تأكد من اتصال الإنترنت.");
            }
        };

        window.prepareEdit = function(id, category, name, dose, time, reminderTime, doctor, stock, threshold, dailyConsumption, notes) {
            document.getElementById('editId').value = id;
            document.getElementById('medCategory').value = category || '';
            document.getElementById('medName').value = name;
            document.getElementById('medDose').value = dose;
            document.getElementById('medTime').value = time;
            document.getElementById('medReminderTime').value = reminderTime || '';
            document.getElementById('medDoctor').value = doctor;
            document.getElementById('medStock').value = stock;
            document.getElementById('medThreshold').value = threshold || 5;
            // البيانات القديمة لا تحتوي على تقسيم صباح/مساء، لذلك نحافظ على استهلاكها اليومي كما هو.
            const oldMorningDose = arguments.length > 11 && Number(arguments[11]) >= 0 ? Number(arguments[11]) : Number(dailyConsumption || 1);
            const oldEveningDose = arguments.length > 12 && Number(arguments[12]) >= 0 ? Number(arguments[12]) : 0;
            document.getElementById('medMorningDose').value = oldMorningDose;
            document.getElementById('medEveningDose').value = oldEveningDose;
            document.getElementById('medDailyConsumption').value = Math.max(1, oldMorningDose + oldEveningDose);
            document.getElementById('medNotes').value = notes;
            document.getElementById('formTitle').innerText = '✏️ تعديل بيانات الدواء:';
            document.getElementById('saveBtn').innerText = '💾 حفظ التعديلات';
            document.getElementById('cancelBtn').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.confirmDelete = async function(id, name) {
            if (confirm(`🗑️ هل أنت متأكد من رغبتك في حذف الدواء (${name})؟`)) {
                try {
                    await deleteDoc(doc(db, "medications", id));
                } catch (e) {
                    console.error("خطأ بالحذف:", e);
                }
            }
        };

        // --- حساب الاستهلاك اليومي تلقائياً من جرعة الصباح والمساء ---
        function updateDailyConsumptionField() {
            const morning = Math.max(0, parseInt(document.getElementById('medMorningDose').value) || 0);
            const evening = Math.max(0, parseInt(document.getElementById('medEveningDose').value) || 0);
            document.getElementById('medDailyConsumption').value = morning + evening;
        }

        document.getElementById('medMorningDose').addEventListener('input', updateDailyConsumptionField);
        document.getElementById('medEveningDose').addEventListener('input', updateDailyConsumptionField);

        // --- حفظ أو تعديل ---
        saveBtn.addEventListener('click', async () => {
            const name = document.getElementById('medName').value.trim();
            if (!name) {
                alert('⚠️ الرجاء إدخال اسم الدواء على الأقل');
                return;
            }

            const reminderTime = document.getElementById('medReminderTime').value;
            const editId = document.getElementById('editId').value;

            const img1File = document.getElementById('img1File').files[0];
            const img2File = document.getElementById('img2File').files[0];
            const img3File = document.getElementById('img3File').files[0];

            let img1 = await convertFileToBase64(img1File);
            let img2 = await convertFileToBase64(img2File);
            let img3 = await convertFileToBase64(img3File);

            const morningDose = Math.max(0, parseInt(document.getElementById('medMorningDose').value) || 0);
            const eveningDose = Math.max(0, parseInt(document.getElementById('medEveningDose').value) || 0);
            const dailyConsumption = morningDose + eveningDose;

            if (dailyConsumption <= 0) {
                alert('⚠️ أدخل كمية الصباح أو المساء على الأقل.');
                return;
            }

            // يتم حفظ الجرعتين منفصلتين، والاستهلاك اليومي هو مجموعهما.
            const medData = {
                category: document.getElementById('medCategory').value.trim() || 'غير مصنف',
                name: name,
                dose: document.getElementById('medDose').value.trim() || 'غير محددة',
                time: document.getElementById('medTime').value.trim() || 'غير محدد',
                reminderTime: reminderTime,
                doctor: document.getElementById('medDoctor').value.trim() || 'غير محدد',
                stock: parseInt(document.getElementById('medStock').value) || 0,
                threshold: parseInt(document.getElementById('medThreshold').value) || 5,
                dailyConsumption: dailyConsumption,
                morningDose: morningDose,
                eveningDose: eveningDose,
                notes: document.getElementById('medNotes').value.trim() || 'لا توجد ملاحظات',
                updatedAt: new Date()
            };

            if (img1) medData.img1 = img1;
            if (img2) medData.img2 = img2;
            if (img3) medData.img3 = img3;

            try {
                if (editId) {
                    await updateDoc(doc(db, "medications", editId), medData);
                    alert('✅ تم تحديث بيانات الدواء بنجاح!');
                } else {
                    // يبدأ عدّ الاستهلاك من يوم إضافة الدواء.
                    // عند فتح التطبيق لاحقاً سيُحسب كل يوم فائت بأثر رجعي.
                    const creationDate = new Date();
                    medData.createdAt = creationDate;
                    medData.lastDoseDate = getLocalDateKey(creationDate);

                    await addDoc(collection(db, "medications"), medData);
                    alert('✅ تم إضافة الدواء بنجاح!');
                }
                resetForm();
            } catch (error) {
                console.error("خطأ بالحفظ: ", error);
                alert('❌ حدث خطأ أثناء الحفظ، يرجى المحاولة مرة أخرى.');
            }
        });

        // --- عرض القائمة والتحديثات ---
        onSnapshot(collection(db, "medications"), (snapshot) => {
            window._lastSnapshot = snapshot;

            medListEl.innerHTML = '';
            if (snapshot.empty) {
                medListEl.innerHTML = '<p style="text-align: center; color: #64748b;">📭 لا توجد أدوية مسجلة حالياً.</p>';
            } else {
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const id = docSnap.id;

                    // تجاهل المستندات التي ليس لها اسم (منع ظهور undefined)
                    if (!data.name || data.name.trim() === '') return;

                    const threshold = data.threshold || 5;
                    const isLowStock = (data.stock || 0) <= threshold;
                    const warningHtml = isLowStock ? `<span class="stock-warning">⚠️ مخزون منخفض! (${data.stock})</span>` : '';

                    const reminderHtml = data.reminderTime ? `<span class="reminder-badge">? تذكير: ${data.reminderTime}</span>` : '';

                    // حساب الأيام المتبقية
                    const daily = data.dailyConsumption || 1;
                    const daysLeft = Math.floor((data.stock || 0) / daily);
                    let daysHtml = '';
                    if (daysLeft > 0) {
                        const lowDays = daysLeft <= 3 ? 'low' : '';
                        daysHtml = `<span class="days-left-badge ${lowDays}">📅 ${daysLeft} يوم متبقي</span>`;
                    } else {
                        daysHtml = `<span class="days-left-badge low">⛔ انتهى المخزون</span>`;
                    }

                    let imagesHtml = '';
                    if (data.img1 || data.img2 || data.img3) {
                        imagesHtml = '<div class="med-images">';
                        if (data.img1) imagesHtml += `<img src="${data.img1}" alt="صورة 1">`;
                        if (data.img2) imagesHtml += `<img src="${data.img2}" alt="صورة 2">`;
                        if (data.img3) imagesHtml += `<img src="${data.img3}" alt="صورة 3">`;
                        imagesHtml += '</div>';
                    }

                    const li = document.createElement('li');
                    li.className = 'med-item';
                    li.innerHTML = `
                        <div class="med-main-row">
                            <div class="med-details">
                                <div class="med-name">
                                    ${data.name} 
                                    <span style="color: #2563eb; font-size: 0.95rem;">الجرعة: ${data.dose}</span>
                                    ${warningHtml}
                                    ${reminderHtml}
                                    ${daysHtml}
                                </div>
                                <div class="med-info">📂 التصنيف: ${data.category || 'غير مصنف'}</div>
                                <div class="med-info">🕐 الوقت: ${data.time} | 👨‍⚕️ الطبيب: ${data.doctor}</div>
                                <div class="med-info" style="color: #0284c7;">📝 ملاحظات: ${data.notes}</div>
                                <div class="med-info">📉 الاستهلاك اليومي: ${daily} حبة/يوم</div>
                            </div>
                            <div class="counter-box">
                                <span>📦 المخزون:</span>
                                <button class="counter-btn" onclick="updateStock('${id}', ${data.stock ?? 0}, -1)">-</button>
                                <span>${data.stock ?? 0}</span>
                                <button class="counter-btn" onclick="updateStock('${id}', ${data.stock ?? 0}, 1)">+</button>
                            </div>
                            <div class="actions">
                                <button class="edit-btn" onclick="prepareEdit('${id}', '${data.category || ''}', '${data.name}', '${data.dose}', '${data.time}', '${data.reminderTime || ''}', '${data.doctor}', ${data.stock ?? 0}, ${data.threshold || 5}, ${daily}, '${data.notes}', ${Number(data.morningDose ?? daily)}, ${Number(data.eveningDose ?? 0)})">✏️ تعديل</button>
                                <button class="delete-btn" onclick="confirmDelete('${id}', '${data.name}')">🗑️ حذف</button>
                            </div>
                        </div>
                        ${imagesHtml}
                    `;
                    medListEl.appendChild(li);
                });
            }

            // تحديث الملخص
            let totalCount = 0;
            let totalStock = 0;
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                // فقط الأدوية التي لها اسم
                if (data.name && data.name.trim() !== '') {
                    totalCount++;
                    totalStock += (data.stock || 0);
                }
            });
            totalCountEl.textContent = totalCount;
            totalStockEl.textContent = totalStock;

            // تحديث المودال إذا كانت مفتوحة
            const modalOverlay = document.getElementById('stockModal');
            if (modalOverlay.classList.contains('active')) {
                renderModalContent(snapshot);
            }

            // بعد وصول بيانات Firebase فعلياً، شغّل الخصم فوراً.
            // هذا هو الإصلاح الأساسي: لا نعتمد على تأخير ثابت بعد فتح الصفحة.
            runAutomaticDeductionAfterFirebaseLoad();
        });

        // --- دالة عرض محتوى المودال ---
        function renderModalContent(snapshot) {
            if (snapshot.empty) {
                modalBody.innerHTML = `<div class="empty-stock-msg">📭 لا توجد أدوية مسجلة حالياً.</div>`;
                return;
            }
            let tableHtml = `
                <table class="stock-table">
                    <thead>
                        <tr>
                            <th>التصنيف</th>
                            <th>اسم الدواء</th>
                            <th>الجرعة</th>
                            <th>الاستهلاك اليومي</th>
                            <th>الأيام المتبقية</th>
                            <th>المخزون</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                if (!data.name || data.name.trim() === '') return;
                const daily = data.dailyConsumption || 1;
                const daysLeft = Math.floor((data.stock || 0) / daily);
                const isLow = (data.stock || 0) <= (data.threshold || 5);
                const stockDisplay = isLow ? `?? ${data.stock ?? 0}` : `${data.stock ?? 0}`;
                tableHtml += `
                    <tr>
                        <td>${data.category || 'غير مصنف'}</td>
                        <td class="med-name-col">${data.name}</td>
                        <td>${data.dose || 'غير محددة'}</td>
                        <td>${daily} حبة/يوم</td>
                        <td>${daysLeft > 0 ? daysLeft + ' يوم' : 'انتهى'}</td>
                        <td class="stock-col">${stockDisplay}</td>
                    </tr>
                `;
            });
            tableHtml += `</tbody></table>`;
            modalBody.innerHTML = tableHtml;
        }

        // --- أحداث المودال ---
        document.getElementById('viewStockBtn').addEventListener('click', () => {
            const modalOverlay = document.getElementById('stockModal');
            modalOverlay.classList.add('active');
            if (window._lastSnapshot) {
                renderModalContent(window._lastSnapshot);
            } else {
                modalBody.innerHTML = '<p style="color: #64748b;">⏳ جاري تحميل البيانات...</p>';
            }
        });

        document.getElementById('closeModalBtn').addEventListener('click', () => {
            document.getElementById('stockModal').classList.remove('active');
        });
        document.getElementById('stockModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) {
                document.getElementById('stockModal').classList.remove('active');
            }
        });

        // =============================================
        // 🔔 الخصم التلقائي من المخزون - خصم يومي بأثر رجعي
        // الإصدار المصحح:
        // 1) لا يعتمد على setTimeout بعد فتح الصفحة.
        // 2) يبدأ مباشرة عند وصول بيانات Firebase عبر onSnapshot.
        // 3) يعالج جميع الأيام غير المحتسبة دفعة واحدة.
        // 4) يستخدم Transaction لمنع الخصم المكرر عند فتح التطبيق
        //    في أكثر من تبويب/جهاز في نفس الوقت.
        // 5) يعيد الفحص عند العودة إلى الصفحة وعند التركيز عليها.
        // =============================================

        const deductionInProgress = new Set();
        let catchUpRunning = false;

        function getLocalDateKey(date = new Date()) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        // تحويل أي تاريخ محفوظ في Firestore إلى YYYY-MM-DD بالتوقيت المحلي.
        function toLocalDateKey(value) {
            if (!value) return '';

            try {
                if (typeof value === 'string') {
                    if (/^\d{4}-\d{2}-\d{2}$/.test(value)) return value;

                    const d = new Date(value);
                    if (!Number.isNaN(d.getTime())) {
                        return getLocalDateKey(d);
                    }
                }

                // Firestore Timestamp
                if (value && typeof value.toDate === 'function') {
                    const d = value.toDate();
                    if (!Number.isNaN(d.getTime())) {
                        return getLocalDateKey(d);
                    }
                }

                // JavaScript Date
                if (value instanceof Date && !Number.isNaN(value.getTime())) {
                    return getLocalDateKey(value);
                }
            } catch (e) {
                console.error("خطأ في قراءة تاريخ الخصم:", e);
            }

            return '';
        }

        // عدد الأيام التقويمية بين تاريخين محليين.
        function daysBetweenLocalDates(fromKey, toKey) {
            if (!fromKey || !toKey || fromKey >= toKey) return 0;

            const [fy, fm, fd] = fromKey.split('-').map(Number);
            const [ty, tm, td] = toKey.split('-').map(Number);

            const from = new Date(fy, fm - 1, fd);
            const to = new Date(ty, tm - 1, td);

            // نستخدم UTC للتخلص من مشاكل التوقيت الصيفي بين منتصف ليل وآخر.
            const fromUtc = Date.UTC(from.getFullYear(), from.getMonth(), from.getDate());
            const toUtc = Date.UTC(to.getFullYear(), to.getMonth(), to.getDate());

            return Math.max(0, Math.floor((toUtc - fromUtc) / 86400000));
        }

        // اليوم الذي يسمح النظام باحتسابه الآن.
        // إذا كان موعد الجرعة لم يأت بعد، نعالج حتى أمس فقط.
        function getLastProcessableDate(reminderTime, now = new Date()) {
            const todayKey = getLocalDateKey(now);

            if (!reminderTime) {
                return todayKey;
            }

            const parts = String(reminderTime).trim().split(':');
            if (parts.length !== 2) {
                return todayKey;
            }

            const h = Number(parts[0]);
            const m = Number(parts[1]);

            if (
                !Number.isInteger(h) || !Number.isInteger(m) ||
                h < 0 || h > 23 || m < 0 || m > 59
            ) {
                return todayKey;
            }

            const nowMinutes = now.getHours() * 60 + now.getMinutes();
            const reminderMinutes = h * 60 + m;

            if (nowMinutes >= reminderMinutes) {
                return todayKey;
            }

            // لم يحن موعد جرعة اليوم، لذلك آخر يوم قابل للمعالجة هو أمس.
            const yesterday = new Date(
                now.getFullYear(),
                now.getMonth(),
                now.getDate() - 1
            );
            return getLocalDateKey(yesterday);
        }

        function subtractOneLocalDay(dateKey) {
            const [y, m, d] = dateKey.split('-').map(Number);
            const date = new Date(y, m - 1, d);
            date.setDate(date.getDate() - 1);
            return getLocalDateKey(date);
        }

        async function deductMedicationRetroactively(docSnap, now = new Date()) {
            const id = docSnap.id;

            if (deductionInProgress.has(id)) return;
            deductionInProgress.add(id);

            try {
                const medRef = doc(db, "medications", id);

                const result = await runTransaction(db, async (transaction) => {
                    // قراءة أحدث نسخة من Firebase داخل Transaction.
                    const freshSnap = await transaction.get(medRef);

                    if (!freshSnap.exists()) {
                        return { changed: false };
                    }

                    const data = freshSnap.data();

                    if (!data.name || String(data.name).trim() === '') {
                        return { changed: false };
                    }

                    const daily = Math.max(1, Number(data.dailyConsumption) || 1);
                    const currentStock = Math.max(0, Number(data.stock) || 0);
                    const reminderTime = String(data.reminderTime || '').trim();

                    const todayKey = getLocalDateKey(now);
                    const processUntilKey = getLastProcessableDate(reminderTime, now);

                    let lastDoseDate = toLocalDateKey(data.lastDoseDate);

                    // للأدوية القديمة التي لا تملك تاريخاً:
                    // نستخدم createdAt كنقطة بداية إن وجد.
                    if (!lastDoseDate) {
                        lastDoseDate = toLocalDateKey(data.createdAt);

                        if (!lastDoseDate) {
                            transaction.update(medRef, {
                                lastDoseDate: todayKey,
                                updatedAt: new Date()
                            });

                            return {
                                changed: true,
                                name: data.name,
                                deducted: 0,
                                missedDays: 0,
                                newStock: currentStock,
                                initialized: true
                            };
                        }
                    }

                    // حماية من تاريخ مستقبلي بسبب تغيير ساعة الجهاز.
                    if (lastDoseDate > todayKey) {
                        transaction.update(medRef, {
                            lastDoseDate: todayKey,
                            updatedAt: new Date()
                        });

                        return {
                            changed: true,
                            name: data.name,
                            deducted: 0,
                            missedDays: 0,
                            newStock: currentStock,
                            correctedFutureDate: true
                        };
                    }

                    // لا يوجد يوم جديد يمكن احتسابه.
                    if (
                        !processUntilKey ||
                        lastDoseDate >= processUntilKey
                    ) {
                        return { changed: false };
                    }

                    const missedDays = daysBetweenLocalDates(
                        lastDoseDate,
                        processUntilKey
                    );

                    if (missedDays <= 0) {
                        return { changed: false };
                    }

                    const requestedDeduction = missedDays * daily;
                    const actualDeduction = Math.min(
                        currentStock,
                        requestedDeduction
                    );

                    const newStock = Math.max(
                        0,
                        currentStock - actualDeduction
                    );

                    // مهم جداً:
                    // نثبت آخر يوم تمت معالجته حتى لا يعاد خصمه في الفتح القادم.
                    transaction.update(medRef, {
                        stock: newStock,
                        lastDoseDate: processUntilKey,
                        updatedAt: new Date()
                    });

                    return {
                        changed: true,
                        name: data.name,
                        deducted: actualDeduction,
                        missedDays,
                        daily,
                        newStock,
                        processedUntil: processUntilKey
                    };
                });

                if (result && result.changed) {
                    localStorage.setItem(
                        `lastDeduction_${id}`,
                        result.processedUntil || getLocalDateKey(now)
                    );

                    if (result.deducted > 0) {
                        const skippedText = result.missedDays > 1
                            ? `تم احتساب ${result.missedDays} أيام بأثر رجعي`
                            : 'تم احتساب جرعة واحدة';

                        console.log(
                            `💊 ${result.name}: ${skippedText}. ` +
                            `تم خصم ${result.deducted} حبة. ` +
                            `المخزون المتبقي: ${result.newStock}`
                        );
                    }
                }
            } catch (err) {
                console.error(
                    `❌ خطأ في الخصم التلقائي للدواء ${id}:`,
                    err
                );
            } finally {
                deductionInProgress.delete(id);
            }
        }

        async function checkReminders() {
            if (catchUpRunning) return;

            const snapshot = window._lastSnapshot;
            if (!snapshot || snapshot.empty) return;

            catchUpRunning = true;

            try {
                const now = new Date();

                const jobs = [];

                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();

                    if (!data.name || String(data.name).trim() === '') {
                        return;
                    }

                    jobs.push(
                        deductMedicationRetroactively(docSnap, now)
                    );
                });

                await Promise.allSettled(jobs);
            } finally {
                catchUpRunning = false;
            }
        }

        // ==========================================================
        // الفحص الأساسي:
        // لا ننتظر 1.5 ثانية ونفترض أن Firebase انتهى.
        // بمجرد وصول snapshot نبدأ الخصم مباشرة.
        // ==========================================================
        function runAutomaticDeductionAfterFirebaseLoad() {
            checkReminders().catch((err) => {
                console.error("❌ خطأ في فحص الخصم:", err);
            });
        }

        // عند فتح التطبيق أو تحديث البيانات.
        // هذا المستمع يجب أن يطلق الفحص بعد وصول Firebase مباشرة.
        // ملاحظة: يوجد onSnapshot الأساسي للقائمة أعلاه.
        // سنستدعي checkReminders منه أيضاً في تعديل صغير أدناه.

        // إعادة الفحص كل دقيقة كشبكة أمان أثناء بقاء الصفحة مفتوحة.
        setInterval(() => {
            runAutomaticDeductionAfterFirebaseLoad();
        }, 60000);

        // عند العودة إلى التبويب بعد أن كان بالخلفية.
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                runAutomaticDeductionAfterFirebaseLoad();
            }
        });

        // عند العودة إلى النافذة.
        window.addEventListener('focus', runAutomaticDeductionAfterFirebaseLoad);

        // عند استعادة الصفحة من BFCache أو إعادة إظهارها.
        window.addEventListener('pageshow', runAutomaticDeductionAfterFirebaseLoad);

        // =============================================
        // 📤 تصدير البيانات إلى JSON (زر التصدير)
        // =============================================
        window.exportData = function() {
            const snapshot = window._lastSnapshot;
            if (!snapshot || snapshot.empty) {
                alert('📭 لا توجد بيانات للتصدير.');
                return;
            }

            const data = [];
            snapshot.forEach((docSnap) => {
                const d = docSnap.data();
                if (d.name && d.name.trim() !== '') {
                    data.push({ id: docSnap.id, ...d });
                }
            });

            const json = JSON.stringify(data, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            const dateStr = new Date().toISOString().slice(0, 10);
            a.download = `medications_${dateStr}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        };

        document.getElementById('exportBtn').addEventListener('click', window.exportData);

        // تعريف الدوال العامة مرة أخرى
        window.resetForm = resetForm;
        window.updateStock = updateStock;
        window.prepareEdit = prepareEdit;
        window.confirmDelete = confirmDelete;

        console.log('✅ تم تحميل النظام بالكامل مع خاصية الخصم التلقائي عند موعد الجرعة');
    </script>
</body>
</html>
